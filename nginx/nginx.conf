events {}

http {

    upstream backend {

    server api-1:5000 max_fails=2 fail_timeout=15s;

    server api-2:5000 max_fails=2 fail_timeout=15s;

    server api-3:5000 max_fails=2 fail_timeout=15s;
}

    server {

        listen 80;

        location / {

            proxy_pass http://backend;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}