  api-1:
    init: true

    build: .

    ports:
      - "5001:5000"

    env_file:
      - .env

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/f1drivers
      INSTANCE_NAME: api-1

    depends_on:
    - mongo
    - redis


  api-2:
    init: true

    build: .

    ports:
      - "5002:5000"

    env_file:
      - .env

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/f1drivers
      INSTANCE_NAME: api-2

    depends_on:
    - mongo
    - redis

  api-3:
    init: true

    build: .

    ports:
      - "5003:5000"

    env_file:
      - .env

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/f1drivers
      INSTANCE_NAME: api-3

    depends_on:
      - mongo
      - redis

 

  mongo:

    image: mongo:latest

    ports:
      - "27017:27017"

    profiles:
      - dev
      - monitoring
      - workers

  redis:

    image: redis:latest

    ports:
    - "6379:6379"

    profiles:
      - dev
      - monitoring
      - workers
  
  nginx:
    image: nginx:latest

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      
    depends_on:
      - api-1
      
